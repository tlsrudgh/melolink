<!doctype html>
<html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>MeloLink 크로스페이드</title>
<style>
body{font:1rem/1.6 system-ui;background:#edf4ef;color:#18362b;margin:0}main{max-width:34rem;margin:8vh auto;padding:2rem;background:white;border-radius:1rem}label{display:grid;gap:.4rem;margin:1.2rem 0}input,button{font:inherit;padding:.5rem}button{cursor:pointer}
</style>
<main><h1>두 곡 크로스페이드</h1><form id="controls"><fieldset id="settings"><legend>재생 설정</legend>
<label>두 곡 전환 계획(JSON, 선택)<input type="file" accept=".json" id="plan"></label>
<label>첫 번째 곡 ID<input id="firstId" value="A"></label>
<label>첫 번째 음원<input required type="file" accept="audio/*" id="first"></label>
<label>두 번째 곡 ID<input id="secondId" value="B"></label>
<label>두 번째 음원<input required type="file" accept="audio/*" id="second"></label>
<label>페이드 길이(초)<input required type="number" min="0.1" step="0.1" value="5" id="fade"></label></fieldset>
<p><button id="play">재생</button> <button type="button" disabled id="stop">정지</button></p></form>
<output id="status" aria-live="polite">첫 곡의 끝부분에서 두 번째 곡으로 전환합니다.</output></main><script src="player.js"></script></html>
